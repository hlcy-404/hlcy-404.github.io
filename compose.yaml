name: hlcy-blog
services:
  blog:
    image: ruby:3.3-bookworm
    working_dir: /site
    volumes:
      - .:/site
      - gems:/usr/local/bundle
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      BUNDLE_PATH: /usr/local/bundle
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
      JEKYLL_ENV: development
    command: >-
      bash -lc "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --force_polling"
volumes:
  gems:
