  description: 与我共同参与 FG-MoE 研究，探索遥感影像中的伪造目标感知。
  biography: |
    现为中国科学院大学（[UCAS](https://www.ucas.ac.cn/)）人工智能专业工学硕士，本科就读于武汉工程大学（[WIT](https://www.wit.edu.cn/)），本科期间师从[赵彤洲](https://cs.wit.edu.cn/info/1026/5517.htm)老师与[李迅](https://cs.wit.edu.cn/info/1026/8528.htm)老师，综合测评位列专业 *1/41*、GPA *3.91*、`2024届优秀毕业生`、`2024年推荐免试攻读硕士研究生学位资格`。

    本科期间接触涉略了前后端、机器学习、图像处理、三维重建与智能机器人等方向；在大二学年加入了[湖北省重点机器人实验室](https://robot.wit.edu.cn/)接触智能机器人系统开发，在人形机器人上实践了图像处理、机器人控制等任务；在大三学年，作为项目负责人带领团队进行机械臂项目的开发，利用深度学习、强化学习等方法打造一款能自适应棋类的机器人，项目参加多项全国学科竞赛。

    曾在中国机器人及人工智能大赛、第十四届蓝桥杯大赛程序设计全国总决赛、中国机器人大赛中获得多项全国奖项；在校多次获得校级一等综合奖学金、优秀青年志愿者、三好学生标兵等荣誉称号。
